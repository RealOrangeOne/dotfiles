- name: Install Torchbox packages
  kewlfft.aur.aur:
    name: "{{ item }}"
  become: true
  become_user: aur_builder
  loop:
    - aws-cli
    - fabric
    - heroku-cli
    - python-aws-mfa
    - redis
    - vagrant
    - zoom

- name: Make Torchbox user
  user:
    name: torchbox
    comment: Torchbox
    shell: /usr/bin/bash
    system: true

- name: Give user sudo access
  lineinfile:
    path: /etc/sudoers.d/00_torchbox
    line: "torchbox ALL=(ALL) ALL"
    create: true
    validate: visudo -cf %s
    mode: 0640
