- name: Make me
  user:
    name: "{{ user }}"
    home: "{{ home }}"
    comment: Jake Howard
    shell: /usr/bin/zsh
    system: "{{ not is_torchbox }}"
    groups:
      - audio
      - games
      - input
      - lp
      - power
      - scanner
      - storage
      - tty
      - users
      - uucp
      - video

- name: Give root a useful shell
  user:
    name: root
    shell: /usr/bin/bash

- name: Give user sudo access
  lineinfile:
    path: /etc/sudoers.d/00_jake
    line: "{{ user }} ALL=(ALL) ALL"
    create: true
    validate: visudo -cf %s
    mode: 0640
  when: not is_torchbox

- name: Install plasma workspace script
  template:
    src: ./files/env.sh
    dest: "{{ home }}/.config/plasma-workspace/env/env.sh"
    mode: 0644
    owner: "{{ user }}"
    group: "{{ user }}"
